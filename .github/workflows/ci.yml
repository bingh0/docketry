name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: install the tarball into a throwaway prefix and run the binary
        run: |
          set -eux
          PREFIX="$RUNNER_TEMP/prefix"
          npm install -g --prefix "$PREFIX" "$RUNNER_TEMP"/bingh-docketry-*.tgz
          # no command prints usage and exits 2, could-not-run, by the docket's exit family (D177);
          # the smoke is a real lint of the house docket, which exits 0
          HOME="$RUNNER_TEMP/home" "$PREFIX/bin/docketry" lint features/DOCKET.md
