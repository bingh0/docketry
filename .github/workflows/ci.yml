name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the same lanes as gherkin-node-test, whose floor docketry's follows (D53):
          # 22.17 is the engines floor, pinned exactly so the floor is tested and
          # not just declared; 24 and 26 are what treecontext and gherkin-trace
          # users run. Policy: active + maintenance LTS lines; 22 rides until its
          # EOL (2027-04), and floors move only at those boundaries.
          - { os: ubuntu-latest, node: 22.17 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: install the tarball into a throwaway prefix and run the binary
        run: |
          set -eux
          PREFIX="$RUNNER_TEMP/prefix"
          npm install -g --prefix "$PREFIX" "$RUNNER_TEMP"/bingh-docketry-*.tgz
          # no command prints the usage to stderr and exits 2, could-not-run, by the exit family (D26, D237);
          # the smoke is a real strict lint of the house docket with its corpus, which exits 0
          HOME="$RUNNER_TEMP/home" "$PREFIX/bin/docketry" lint features/DOCKET.md --corpus features --strict
